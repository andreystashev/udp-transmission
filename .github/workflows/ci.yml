name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  qt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt development tools
        run: sudo apt-get update && sudo apt-get install -y build-essential qtbase5-dev qt5-qmake
      - name: Build applications
        run: |
          mkdir build-sender build-receiver
          cd build-sender
          qmake ../data-sender/dataSender.pro
          make -j2
          cd ../build-receiver
          qmake ../data-receiver/StructReceiver.pro
          make -j2
      - name: Run UDP regression tests
        run: |
          mkdir build-tests
          cd build-tests
          qmake ../tests/tests.pro
          make -j2
          ./udp-tests
